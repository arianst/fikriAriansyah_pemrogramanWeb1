<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Mahasiswa</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="container">
    <div class="form-section">
        <h2>Form Data Mahasiswa</h2>

        <div class="form-group">
            <label>NIM</label>
            <input type="text" id="nim" placeholder="Masukkan NIM" required>
        </div>

        <div class="form-group">
            <label>Nama</label>
            <input type="text" id="nama" placeholder="Masukkan Nama" required>
        </div>

        <div class="form-group">
            <label>Jurusan</label>
            <select id="jurusan" required>
                <option value="">-- Pilih Jurusan --</option>
                <option value="Teknik Informatika">Teknik Informatika</option>
                <option value="Sistem Informasi">Sistem Informasi</option>
                <option value="Teknik Elektro">Teknik Elektro</option>
            </select>
        </div>

        <div class="form-group">
            <label>Fakultas</label>
            <select id="fakultas" required>
                <option value="">-- Pilih Fakultas --</option>
                <option value="Fakultas Ilmu Komputer">Fakultas Ilmu Komputer</option>
                <option value="Fakultas Teknik">Fakultas Teknik</option>
                <option value="Fakultas Ekonomi">Fakultas Ekonomi</option>
            </select>
        </div>

        <div class="button-group">
            <button class="btn-tambah" onclick="tambahData()">Tambah</button>
            <button class="btn-update" onclick="updateData()">Update</button>
        </div>
    </div>

    <div class="table-section">
        <h2>Daftar Mahasiswa</h2>

        <table>
            <thead>
                <tr>
                    <th>No</th>
                    <th>NIM</th>
                    <th>Nama</th>
                    <th>Jurusan</th>
                    <th>Fakultas</th>
                    <th>Aksi</th>
                </tr>
            </thead>
            <tbody id="tabelData"></tbody>
        </table>
    </div>
</div>

    <script>
        let dataMahasiswa = [];
        let indexEdit = -1;

        function tampilData() {
            let tabel = document.getElementById("tabelData");
            tabel.innerHTML = "";

            for (let i = 0; i < dataMahasiswa.length; i++) {
                tabel.innerHTML += `
                    <tr>
                        <td>${i + 1}</td>
                        <td>${dataMahasiswa[i].nim}</td>
                        <td>${dataMahasiswa[i].nama}</td>
                        <td>${dataMahasiswa[i].jurusan}</td>
                        <td>${dataMahasiswa[i].fakultas}</td>
                        <td>
                            <button class="btn-action btn-edit" onclick="editData(${i})">Edit</button>
                            <button class="btn-action btn-hapus" onclick="hapusData(${i})">Hapus</button>
                        </td>
                    </tr>
                `;
            }
        }

        function tambahData() {
            let nim = document.getElementById("nim").value.trim();
            let nama = document.getElementById("nama").value.trim();
            let jurusan = document.getElementById("jurusan").value.trim();
            let fakultas = document.getElementById("fakultas").value.trim();

            // Validasi field yang kosong
            if (nim === "") {
                alert("❌ NIM wajib diisi!");
                document.getElementById("nim").focus();
                return;
            }
            if (nama === "") {
                alert("❌ Nama wajib diisi!");
                document.getElementById("nama").focus();
                return;
            }
            if (jurusan === "") {
                alert("❌ Jurusan wajib dipilih!");
                document.getElementById("jurusan").focus();
                return;
            }
            if (fakultas === "") {
                alert("❌ Fakultas wajib dipilih!");
                document.getElementById("fakultas").focus();
                return;
            }

            let mahasiswa = {
                nim: nim,
                nama: nama,
                jurusan: jurusan,
                fakultas: fakultas
            };

            dataMahasiswa.push(mahasiswa);

            alert("✅ Data mahasiswa berhasil ditambahkan!");
            tampilData();
            kosongkanForm();
        }

        function editData(index) {
            document.getElementById("nim").value = dataMahasiswa[index].nim;
            document.getElementById("nama").value = dataMahasiswa[index].nama;
            document.getElementById("jurusan").value = dataMahasiswa[index].jurusan;
            document.getElementById("fakultas").value = dataMahasiswa[index].fakultas;

            indexEdit = index;
        }

        function updateData() {
            if (indexEdit === -1) {
                alert("❌ Pilih data yang ingin diedit terlebih dahulu!");
                return;
            }

            let nim = document.getElementById("nim").value.trim();
            let nama = document.getElementById("nama").value.trim();
            let jurusan = document.getElementById("jurusan").value.trim();
            let fakultas = document.getElementById("fakultas").value.trim();

            // Validasi field yang kosong
            if (nim === "") {
                alert("❌ NIM wajib diisi!");
                document.getElementById("nim").focus();
                return;
            }
            if (nama === "") {
                alert("❌ Nama wajib diisi!");
                document.getElementById("nama").focus();
                return;
            }
            if (jurusan === "") {
                alert("❌ Jurusan wajib dipilih!");
                document.getElementById("jurusan").focus();
                return;
            }
            if (fakultas === "") {
                alert("❌ Fakultas wajib dipilih!");
                document.getElementById("fakultas").focus();
                return;
            }

            dataMahasiswa[indexEdit].nim = nim;
            dataMahasiswa[indexEdit].nama = nama;
            dataMahasiswa[indexEdit].jurusan = jurusan;
            dataMahasiswa[indexEdit].fakultas = fakultas;

            alert("✅ Data mahasiswa berhasil diperbarui!");
            tampilData();
            kosongkanForm();

            indexEdit = -1;
        }

        function hapusData(index) {
            dataMahasiswa.splice(index, 1);
            tampilData();
        }

        function kosongkanForm() {
            document.getElementById("nim").value = "";
            document.getElementById("nama").value = "";
            document.getElementById("jurusan").value = "";
            document.getElementById("fakultas").value = "";
        }
    </script>

</body>

</html>
