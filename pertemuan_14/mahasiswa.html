<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Mahasiswa</title>
</head>

<body>

<h2>Form Data Mahasiswa</h2>

    <label>NIM</label><br>
    <input type="text" id="nim" placeholder="Masukkan NIM"><br><br>

    <label>Nama</label><br>
    <input type="text" id="nama" placeholder="Masukkan Nama"><br><br>

    <label>Jurusan</label><br>
    <select id="jurusan">
        <option value="">-- Pilih Jurusan --</option>
        <option value="Teknik Informatika">Teknik Informatika</option>
        <option value="Sistem Informasi">Sistem Informasi</option>
        <option value="Teknik Elektro">Teknik Elektro</option>
    </select>
    <br>
    <br>

    <label>Fakultas</label><br>
    <select id="fakultas">
        <option value="">-- Pilih Fakultas --</option>
        <option value="Fakultas Ilmu Komputer">Fakultas Ilmu Komputer</option>
        <option value="Fakultas Teknik">Fakultas Teknik</option>
        <option value="Fakultas Ekonomi">Fakultas Ekonomi</option>
    </select>

    <button onclick="tambahData()">Tambah</button>
    <button onclick="updateData()">Update</button>

    <hr>

    <h2>Daftar Mahasiswa</h2>

    <table border="1" cellpadding="10">
        <thead>
            <tr>
                <th>No</th>
                <th>NIM</th>
                <th>Nama</th>
                <th>Jurusan</th>
                <th>Fakultas</th>
                <th>Aksi</th>
            </tr>
        </thead>
        <tbody id="tabelData"></tbody>
    </table>

    <script>
        let dataMahasiswa = [];
        let indexEdit = -1;

        function tampilData() {
            let tabel = document.getElementById("tabelData");
            tabel.innerHTML = "";

            for (let i = 0; i < dataMahasiswa.length; i++) {
                tabel.innerHTML += `
                    <tr>
                        <td>${i + 1}</td>
                        <td>${dataMahasiswa[i].nim}</td>
                        <td>${dataMahasiswa[i].nama}</td>
                        <td>${dataMahasiswa[i].jurusan}</td>
                        <td>${dataMahasiswa[i].fakultas}</td>
                        <td>
                            <button onclick="editData(${i})">Edit</button>
                            <button onclick="hapusData(${i})">Hapus</button>
                        </td>
                    </tr>
                `;
            }
        }

        function tambahData() {
            let nim = document.getElementById("nim").value;
            let nama = document.getElementById("nama").value;
            let jurusan = document.getElementById("jurusan").value;
            let fakultas = document.getElementById("fakultas").value;

            let mahasiswa = {
                nim: nim,
                nama: nama,
                jurusan: jurusan,
                fakultas: fakultas
            };

            dataMahasiswa.push(mahasiswa);

            tampilData();
            kosongkanForm();
        }

        function editData(index) {
            document.getElementById("nim").value = dataMahasiswa[index].nim;
            document.getElementById("nama").value = dataMahasiswa[index].nama;
            document.getElementById("jurusan").value = dataMahasiswa[index].jurusan;
            document.getElementById("fakultas").value = dataMahasiswa[index].fakultas;

            indexEdit = index;
        }

        function updateData() {
            if (indexEdit === -1) {
                alert("Pilih data yang ingin diedit terlebih dahulu!");
                return;
            }

            dataMahasiswa[indexEdit].nim = document.getElementById("nim").value;
            dataMahasiswa[indexEdit].nama = document.getElementById("nama").value;
            dataMahasiswa[indexEdit].jurusan = document.getElementById("jurusan").value;
            dataMahasiswa[indexEdit].fakultas = document.getElementById("fakultas").value;

            tampilData();
            kosongkanForm();

            indexEdit = -1;
        }

        function hapusData(index) {
            dataMahasiswa.splice(index, 1);
            tampilData();
        }

        function kosongkanForm() {
            document.getElementById("nim").value = "";
            document.getElementById("nama").value = "";
            document.getElementById("jurusan").value = "";
            document.getElementById("fakultas").value = "";
        }
    </script>

</body>

</html>
